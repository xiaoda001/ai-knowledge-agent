server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000

backend_scheduler:
  provider:
    retention:
      interval: 1h
    compaction:
      compaction:
        block_retention: 72h

backend_worker:
  compaction:
    block_retention: 72h
